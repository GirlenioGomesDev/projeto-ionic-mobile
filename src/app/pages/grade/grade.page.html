<!--
  Nível: Difícil | Responsável: Gabriel.
  Tarefa: exibir a grade de aulas e as aulas salvas em Minha agenda.
  Orientação: um ion-segment pode alternar as duas visualizações. Use
  AgendaService para persistir os ids das aulas salvas.
-->
<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Grade</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="page-body">
    <section class="surface-card">
      <p class="eyebrow">Unidade demonstração</p>
      <h2>Horários</h2>
      <p>O quadro de aulas da semana aparece aqui.</p>
    </section>

    <section class="surface-card">
      <h2>Minha agenda</h2>
      <p>Espaço reservado para as aulas salvas.</p>
    </section>
  </main>
</ion-content>
